<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar negocio | Tianguis</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/negocios.css">
    <script src="js/tianguis-negocios.js" defer></script>
    <script src="js/registrar-negocio.js" defer></script>
</head>
<body>
    <header class="topbar">
        <a class="brand" href="index.html">Tianguis</a>
        <nav class="topbar-links" aria-label="Navegación principal">
            <a href="index.html">Volver al mapa</a>
            <a href="login.html">Iniciar sesión</a>
        </nav>
    </header>

    <main class="page-shell">
        <section class="page-card">
            <p class="eyebrow">COMERCIO DE TU COMUNIDAD</p>
            <h1>Registra un negocio</h1>
            <p>El registro es público. No necesitas iniciar sesión.</p>

            <form id="businessForm">
                <div class="form-grid">
                    <div class="form-field">
                        <label for="businessName">Nombre del negocio *</label>
                        <input id="businessName" name="businessName" maxlength="100" required>
                    </div>

                    <div class="form-field">
                        <label for="category">Categoría *</label>
                        <select id="category" name="category" required>
                            <option value="">Selecciona una categoría</option>
                            <option value="ropa">Ropa</option>
                            <option value="comida-preparada">Comida preparada</option>
                            <option value="carne">Carne</option>
                            <option value="pollo">Pollo</option>
                            <option value="pescado">Pescado</option>
                            <option value="frutas-verduras">Fruta y verdura</option>
                            <option value="cremeria">Cremería</option>
                            <option value="libros">Libros</option>
                            <option value="tiendas-catalogo">Tiendas de catálogo</option>
                            <option value="hogar">Hogar</option>
                            <option value="servicios">Servicios</option>
                            <option value="otro">Otro</option>
                        </select>
                    </div>

                    <div class="form-field">
                        <label for="marketId">Tianguis o mercado</label>
                        <select id="marketId" name="marketId">
                            <option value="">No aplica / comercio de barrio</option>
                        </select>
                    </div>

                    <div class="form-field full-width">
                        <label for="location">Ubicación o referencia *</label>
                        <input id="location" name="location" maxlength="240"
                               placeholder="Calle, colonia, alcaldía o referencia" required>
                    </div>

                    <div class="form-field full-width">
                        <label>Selecciona el punto del negocio en el mapa *</label>
                        <div id="locationMap" class="location-picker"
                             role="button" tabindex="0"
                             aria-label="Selecciona en este mapa esquemático la ubicación del negocio">
                            <span id="locationPin" class="location-pin" aria-hidden="true">📍</span>
                        </div>
                        <small id="locationStatus" role="status">Aún no seleccionas el punto.</small>
                    </div>

                    <fieldset class="form-field full-width">
                        <legend>Horario de atención *</legend>
                        <div class="week-days">
                            <label><input type="checkbox" name="days" value="lunes"> Lunes</label>
                            <label><input type="checkbox" name="days" value="martes"> Martes</label>
                            <label><input type="checkbox" name="days" value="miércoles"> Miércoles</label>
                            <label><input type="checkbox" name="days" value="jueves"> Jueves</label>
                            <label><input type="checkbox" name="days" value="viernes"> Viernes</label>
                            <label><input type="checkbox" name="days" value="sábado"> Sábado</label>
                            <label><input type="checkbox" name="days" value="domingo"> Domingo</label>
                        </div>
                        <div class="form-grid">
                            <div class="form-field">
                                <label for="openingTime">Hora de apertura *</label>
                                <input id="openingTime" name="openingTime" type="time" required>
                            </div>
                            <div class="form-field">
                                <label for="closingTime">Hora de cierre *</label>
                                <input id="closingTime" name="closingTime" type="time" required>
                            </div>
                        </div>
                    </fieldset>

                    <div class="form-field full-width">
                        <label for="description">Descripción (opcional)</label>
                        <textarea id="description" name="description" maxlength="300"></textarea>
                    </div>

                    <div class="form-field full-width">
                        <label for="parking">Saturación o estacionamiento (opcional)</label>
                        <select id="parking" name="parking">
                            <option value="">Sin información</option>
                            <option value="Poca saturación; estacionamiento disponible">Poca saturación; estacionamiento disponible</option>
                            <option value="Saturación moderada; estacionamiento limitado">Saturación moderada; estacionamiento limitado</option>
                            <option value="Mucha saturación; poco estacionamiento">Mucha saturación; poco estacionamiento</option>
                            <option value="No cuenta con estacionamiento">No cuenta con estacionamiento</option>
                        </select>
                    </div>

                    <div class="form-field full-width">
                        <label for="photos">Fotos (opcional, máximo 3; cada una hasta 350 KB)</label>
                        <input id="photos" name="photos" type="file" accept="image/*" multiple>
                    </div>

                    <div class="form-field">
                        <label for="contactMethod">Medio de contacto (opcional)</label>
                        <select id="contactMethod" name="contactMethod">
                            <option value="">No agregar contacto</option>
                            <option value="WhatsApp">WhatsApp</option>
                            <option value="Teléfono">Teléfono</option>
                            <option value="Correo">Correo</option>
                        </select>
                    </div>

                    <div class="form-field">
                        <label for="contactValue">Dato de contacto (opcional)</label>
                        <input id="contactValue" name="contactValue" maxlength="120">
                    </div>

                    <div class="form-field full-width">
                        <label class="consent-line">
                            <input id="shareContact" name="shareContact" type="checkbox">
                            Autorizo que se muestre públicamente el dato de contacto.
                        </label>
                    </div>
                </div>

                <div id="formMessage" class="status-message hidden" role="status"></div>

                <div class="form-actions">
                    <button class="primary-action" type="submit">Guardar negocio</button>
                    <a class="secondary-action" href="index.html">Cancelar</a>
                </div>
            </form>
        </section>

        <section id="successMessage" class="page-card hidden" aria-live="polite"></section>
    </main>
</body>
</html>
